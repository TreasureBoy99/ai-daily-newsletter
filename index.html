<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🤖 AI Daily Newsletter - 每日 AI 新闻简报</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        editorial: {
                            light: '#FBFBF9',
                            dark: '#121212',
                            accent: '#C8102E', /* Classic crimson red */
                            accentHover: '#A00D22'
                        }
                    },
                    fontFamily: {
                        serif: ['"Noto Serif SC"', '"Playfair Display"', 'Georgia', 'serif'],
                        sans: ['Inter', '"PingFang SC"', '"Microsoft YaHei"', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Serif+SC:wght@500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', "PingFang SC", sans-serif;
            background-color: #F8F8F6;
        }
        .editorial-title {
            font-family: 'Noto Serif SC', 'Playfair Display', serif;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #CBD5E1;
            border-radius: 4px;
        }
        .dark ::-webkit-scrollbar-thumb {
            background: #475569;
        }
    </style>
</head>
<body class="transition-colors duration-200 ease-in-out text-slate-800 dark:text-slate-100 bg-editorial-light dark:bg-editorial-dark antialiased">
    
    <!-- Top Progress Indicator -->
    <div id="progress-bar" class="fixed top-0 left-0 h-1 bg-editorial-accent z-50 transition-all duration-300" style="width: 0%"></div>

    <!-- Navigation Header -->
    <header class="border-b border-slate-200 dark:border-slate-800 sticky top-0 z-40 bg-white/95 dark:bg-editorial-dark/95 backdrop-blur shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <!-- Brand Logo -->
                <div class="flex items-center space-x-3">
                    <span class="text-2xl sm:text-3xl">🤖</span>
                    <div>
                        <h1 class="text-xl sm:text-2xl font-black tracking-tight text-slate-900 dark:text-white editorial-title">
                            AI Daily <span class="text-editorial-accent">Newsletter</span>
                        </h1>
                        <p class="text-[10px] uppercase tracking-wider font-semibold text-slate-400 dark:text-slate-500">
                            每日 AI 新闻自动聚合
                        </p>
                    </div>
                </div>

                <!-- Right Header Actions -->
                <div class="flex items-center space-x-4">
                    <!-- Calendar Trigger for mobile -->
                    <button id="mobile-archive-btn" class="p-2 text-slate-500 hover:text-editorial-accent md:hidden transition-colors" title="历史归档">
                        <i class="fa-solid fa-calendar-days text-xl"></i>
                    </button>

                    <!-- Theme Toggle -->
                    <button id="theme-toggle" class="p-2 rounded-full hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-500 dark:text-slate-400 transition-all duration-200" title="切换主题">
                        <i class="fa-solid fa-moon text-lg dark:hidden"></i>
                        <i class="fa-solid fa-sun text-lg hidden dark:block"></i>
                    </button>

                    <!-- Github Link -->
                    <a href="https://github.com/adminlove520/ai-daily-newsletter" target="_blank" class="p-2 text-slate-500 hover:text-slate-900 dark:hover:text-white transition-colors" title="GitHub 仓库">
                        <i class="fa-brands fa-github text-xl"></i>
                    </a>
                </div>
            </div>
        </div>
    </header>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="grid grid-cols-1 md:grid-cols-4 gap-8">
            
            <!-- Sidebar (Archive Navigation) -->
            <aside id="archive-sidebar" class="hidden md:block md:col-span-1 bg-white dark:bg-slate-900 rounded-2xl p-5 border border-slate-200 dark:border-slate-800 max-h-[80vh] overflow-y-auto sticky top-24 shadow-sm transition-all duration-300">
                <div class="flex items-center justify-between mb-4 pb-3 border-b border-slate-100 dark:border-slate-800">
                    <h2 class="font-bold text-slate-900 dark:text-white flex items-center space-x-2">
                        <i class="fa-solid fa-archive text-editorial-accent"></i>
                        <span>历史归档</span>
                    </h2>
                    <span id="issue-count" class="text-xs font-semibold bg-slate-100 dark:bg-slate-800 text-slate-500 px-2 py-0.5 rounded-full">-- 期</span>
                </div>
                <div id="archive-list" class="space-y-1">
                    <!-- Loaded dynamically -->
                    <div class="animate-pulse space-y-2">
                        <div class="h-8 bg-slate-100 dark:bg-slate-800 rounded"></div>
                        <div class="h-8 bg-slate-100 dark:bg-slate-800 rounded"></div>
                        <div class="h-8 bg-slate-100 dark:bg-slate-800 rounded"></div>
                    </div>
                </div>
            </aside>

            <!-- Main Content Area -->
            <main class="col-span-1 md:col-span-3 space-y-6">
                
                <!-- Date Header Card -->
                <div class="bg-white dark:bg-slate-900 rounded-2xl p-6 sm:p-8 border border-slate-200 dark:border-slate-800 shadow-sm relative overflow-hidden">
                    <div class="absolute top-0 left-0 right-0 h-1.5 bg-gradient-to-r from-editorial-accent to-rose-400"></div>
                    
                    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between space-y-4 sm:space-y-0">
                        <div>
                            <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold bg-red-50 dark:bg-red-950/30 text-editorial-accent border border-red-100 dark:border-red-900/50 mb-2">
                                <i class="fa-solid fa-newspaper mr-1.5 animate-pulse"></i>最新精选简报
                            </span>
                            <h2 id="newsletter-date" class="text-2xl sm:text-4xl font-extrabold text-slate-900 dark:text-white editorial-title">
                                加载中...
                            </h2>
                            <p id="newsletter-stats" class="text-sm text-slate-400 mt-1">
                                正在获取数据统计...
                            </p>
                        </div>
                        
                        <!-- Manual Refresh / Reset -->
                        <div class="flex items-center space-x-2 self-start sm:self-center">
                            <button id="share-btn" class="inline-flex items-center space-x-1.5 text-xs bg-slate-50 dark:bg-slate-800 hover:bg-slate-100 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 px-3.5 py-2 rounded-xl transition-all border border-slate-200 dark:border-slate-700 font-medium">
                                <i class="fa-solid fa-arrow-up-from-bracket"></i>
                                <span>分享此页</span>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Filters & Search Toolbar -->
                <div class="bg-white dark:bg-slate-900 rounded-xl p-3 border border-slate-200 dark:border-slate-800 shadow-sm sticky top-[4.1rem] z-30 flex flex-col lg:flex-row lg:items-center lg:justify-between gap-3 bg-white/95 dark:bg-slate-900/95 backdrop-blur">
                    <!-- Categories -->
                    <div class="flex items-center overflow-x-auto space-x-1.5 no-scrollbar pb-2 lg:pb-0">
                        <button class="cat-filter-btn px-3 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap transition-all bg-editorial-accent text-white" data-cat="all">
                            全部
                        </button>
                        <button class="cat-filter-btn px-3 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap transition-all bg-slate-50 hover:bg-slate-100 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300" data-cat="announcements">
                            🔥 重大发布
                        </button>
                        <button class="cat-filter-btn px-3 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap transition-all bg-slate-50 hover:bg-slate-100 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300" data-cat="research">
                            🔬 研究论文
                        </button>
                        <button class="cat-filter-btn px-3 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap transition-all bg-slate-50 hover:bg-slate-100 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300" data-cat="tools">
                            🛠️ 工具应用
                        </button>
                        <button class="cat-filter-btn px-3 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap transition-all bg-slate-50 hover:bg-slate-100 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300" data-cat="industry">
                            💰 行业商业
                        </button>
                        <button class="cat-filter-btn px-3 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap transition-all bg-slate-50 hover:bg-slate-100 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300" data-cat="policy">
                            🌍 政策伦理
                        </button>
                        <button class="cat-filter-btn px-3 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap transition-all bg-slate-50 hover:bg-slate-100 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300" data-cat="community">
                            💬 社区热议
                        </button>
                    </div>

                    <!-- Search Input -->
                    <div class="relative flex-grow lg:max-w-xs">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400 dark:text-slate-500">
                            <i class="fa-solid fa-magnifying-glass text-sm"></i>
                        </span>
                        <input id="search-input" type="text" placeholder="搜索新闻、关键字、信息源..." class="w-full text-xs pl-9 pr-4 py-2 border border-slate-200 dark:border-slate-700 rounded-lg focus:outline-none focus:ring-1 focus:ring-editorial-accent bg-slate-50 dark:bg-slate-800 text-slate-800 dark:text-slate-100 placeholder-slate-400 dark:placeholder-slate-500 transition-all">
                    </div>
                </div>

                <!-- Articles Grid/List Container -->
                <div id="news-container" class="space-y-4">
                    <!-- Skeletons loading state -->
                    <div class="bg-white dark:bg-slate-900 rounded-xl p-6 border border-slate-200 dark:border-slate-800 animate-pulse space-y-4">
                        <div class="flex items-center justify-between">
                            <div class="h-4 w-24 bg-slate-100 dark:bg-slate-800 rounded"></div>
                            <div class="h-4 w-32 bg-slate-100 dark:bg-slate-800 rounded"></div>
                        </div>
                        <div class="h-6 w-3/4 bg-slate-100 dark:bg-slate-800 rounded"></div>
                        <div class="h-16 w-full bg-slate-100 dark:bg-slate-800 rounded"></div>
                        <div class="h-8 w-28 bg-slate-100 dark:bg-slate-800 rounded"></div>
                    </div>
                    <div class="bg-white dark:bg-slate-900 rounded-xl p-6 border border-slate-200 dark:border-slate-800 animate-pulse space-y-4">
                        <div class="flex items-center justify-between">
                            <div class="h-4 w-24 bg-slate-100 dark:bg-slate-800 rounded"></div>
                            <div class="h-4 w-32 bg-slate-100 dark:bg-slate-800 rounded"></div>
                        </div>
                        <div class="h-6 w-1/2 bg-slate-100 dark:bg-slate-800 rounded"></div>
                        <div class="h-16 w-full bg-slate-100 dark:bg-slate-800 rounded"></div>
                        <div class="h-8 w-28 bg-slate-100 dark:bg-slate-800 rounded"></div>
                    </div>
                </div>

            </main>
        </div>
    </div>

    <!-- Mobile Drawer Archive Calendar -->
    <div id="mobile-archive-drawer" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 transition-opacity duration-300 ease-in-out opacity-0 pointer-events-none md:hidden">
        <div class="fixed inset-y-0 right-0 max-w-xs w-full bg-white dark:bg-slate-900 shadow-xl flex flex-col h-full transform translate-x-full transition-transform duration-300 ease-in-out">
            <!-- Header -->
            <div class="p-4 border-b border-slate-100 dark:border-slate-800 flex items-center justify-between">
                <h3 class="font-bold text-slate-900 dark:text-white flex items-center space-x-2">
                    <i class="fa-solid fa-calendar-days text-editorial-accent"></i>
                    <span>历史归档列表</span>
                </h3>
                <button id="close-drawer-btn" class="p-1 rounded-lg text-slate-400 hover:text-slate-600 dark:hover:text-white transition-colors">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            <!-- Body -->
            <div id="mobile-archive-list" class="flex-grow overflow-y-auto p-4 space-y-1">
                <!-- Loaded dynamically -->
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="border-t border-slate-200 dark:border-slate-800 py-8 mt-16 bg-white dark:bg-slate-900/40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center space-y-2">
            <p class="text-xs text-slate-400 dark:text-slate-500">
                本简报完全由 GitHub Actions 每日定时运行，通过 AI 精准匹配和内容过滤聚合，基于 GitHub Pages & Vercel 无服务器部署。
            </p>
            <p class="text-xs font-semibold text-slate-400 dark:text-slate-500 flex items-center justify-center space-x-1.5">
                <span>Made with ❤️ for AI Enthusiasts</span>
                <span>•</span>
                <a href="https://github.com/adminlove520/ai-daily-newsletter" target="_blank" class="hover:text-editorial-accent underline">Source Code</a>
            </p>
        </div>
    </footer>

    <!-- App Logic -->
    <script src="app.js"></script>
</body>
</html>
