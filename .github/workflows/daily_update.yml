name: Daily AI News Fetcher

on:
  schedule:
    - cron: '0 0 * * *'  # Runs daily at 00:00 UTC (8:00 AM Beijing time)
  workflow_dispatch:      # Allows manual trigger

permissions:
  contents: write
  pages: write

jobs:
  fetch_and_update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Fetch Script
        run: |
          python scripts/fetch_ai_news.py --outdir data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update latest and index JSON
        run: |
          python scripts/update_index.py

      - name: Send newsletter emails to subscribers
        run: |
          python scripts/send_emails.py
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff-index --quiet HEAD || git commit -m "chore: daily update AI news JSON [skip ci]"
          git push
